[project]
name = "guardrails"
version = "1.0.0"
description = "Shared CI checks, branch rules and Claude rules for the designed7000 repos"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["checks", "scripts", "claude/hooks"]

[tool.ruff]
line-length = 100
extend-exclude = [".guardrails"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["checks", "scripts", "claude/hooks"]
