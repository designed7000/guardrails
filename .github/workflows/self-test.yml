# CI for the guardrails repo itself. It runs the same checks as every other repo,
# from this commit, plus linters for the workflow files.
name: self-test

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
    with:
      python: true

  lint:
    name: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      ZIZMOR_VERSION: "1.32.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"

      - name: actionlint
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" "$url"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          # Lint the caller template as a workflow file too.
          mkdir -p "$RUNNER_TEMP/template/.github/workflows"
          cp templates/caller.yml "$RUNNER_TEMP/template/.github/workflows/"
          "$RUNNER_TEMP/actionlint" -color
          "$RUNNER_TEMP/actionlint" -color "$RUNNER_TEMP/template/.github/workflows/caller.yml"

      - name: zizmor (workflow security)
        if: ${{ !cancelled() }}
        run: |
          uvx "zizmor@$ZIZMOR_VERSION" --offline --config zizmor.yml --min-severity medium \
            .github/workflows "$RUNNER_TEMP/template/.github/workflows"
